<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>رادار أخبار السوق المباشر</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --gold-bg: rgba(251, 191, 36, 0.14);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.15);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.15);
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 14px; }
    .container { max-width: 860px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.25rem; margin: 0; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    
    .controls-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .meta { font-size: 0.8rem; color: var(--muted); }
    
    .watchlist-box { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
    .watchlist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
    .watchlist-title { font-size: 0.88rem; color: var(--gold); font-weight: bold; }
    .add-ticker { display: flex; gap: 6px; }
    .add-ticker input { background: #0f172a; border: 1px solid #475569; color: var(--text); padding: 5px 10px; border-radius: 8px; width: 85px; text-transform: uppercase; font-size: 0.85rem; }
    .add-ticker button { background: var(--gold); color: #0f172a; border: none; padding: 5px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .tickers-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .ticker-tag { background: var(--gold-bg); border: 1px solid var(--gold); color: var(--gold); padding: 3px 10px; border-radius: 16px; font-size: 0.82rem; font-weight: bold; display: flex; align-items: center; gap: 6px; direction: ltr; }
    .ticker-tag span { cursor: pointer; color: #fca5a5; }

    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn { background: var(--card); color: var(--text); border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.82rem; }
    .btn.active { background: var(--accent); color: #0f172a; font-weight: bold; border-color: var(--accent); }
    .btn.gold-filter.active { background: var(--gold); color: #0f172a; border-color: var(--gold); }
    .sound-btn { background: #1e293b; border: 1px solid var(--gold); color: var(--gold); padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
    .sound-btn.muted { border-color: #475569; color: var(--muted); }
    .notif-btn { background: #1e293b; border: 1px solid var(--accent); color: var(--accent); padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
    .notif-btn.granted { border-color: var(--green); color: var(--green); }

    /* بطاقة الخبر */
    .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .card.highlight { border: 2px solid var(--gold); background: linear-gradient(145deg, #1e293b 0%, #2a2417 100%); box-shadow: 0 0 15px rgba(251, 191, 36, 0.15); }
    
    /* الشريط العلوي للبطاقة: الرمز + التأثير */
    .card-top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(51, 65, 85, 0.7); }
    .symbols-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    .copy-symbol-btn {
      background: #0f172a;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      direction: ltr;
      transition: all 0.15s;
    }
    .copy-symbol-btn:hover { background: var(--accent); color: #0f172a; }
    .copy-symbol-btn.is-watchlist { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }
    .copy-symbol-btn.is-watchlist:hover { background: var(--gold); color: #0f172a; }

    /* شارات التأثير */
    .sentiment-badge { padding: 4px 10px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    .sentiment-pos { background: var(--green-bg); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .sentiment-neg { background: var(--red-bg); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .sentiment-neu { background: rgba(148, 163, 184, 0.12); color: var(--muted); border: 1px solid rgba(148, 163, 184, 0.3); }

    .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
    .account-name { color: var(--accent); font-weight: bold; direction: ltr; }
    .card-time { direction: ltr; }
    
    .ar-text { font-size: 1.02rem; line-height: 1.7; color: #ffffff; margin-bottom: 10px; font-weight: 500; background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 8px; border-right: 3px solid var(--accent); white-space: pre-line; }
    .card.highlight .ar-text { border-right-color: var(--gold); }
    .en-text { line-height: 1.6; font-size: 0.88rem; color: #cbd5e1; direction: ltr; text-align: left; white-space: pre-line; background: rgba(15, 23, 42, 0.25); padding: 10px; border-radius: 8px; }
    
    mark.ticker-hl { background: var(--gold); color: #0f172a; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
    .card-footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card-footer a { color: var(--accent); text-decoration: none; font-size: 0.82rem; }
    .copy-full-btn { background: transparent; border: 1px solid #475569; color: var(--muted); padding: 3px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
    .copy-full-btn:hover { border-color: var(--text); color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="live-dot"></span> بث السوق المباشر (مترجم)</h1>
      <div class="controls-top">
        <button id="notifBtn" class="notif-btn" onclick="requestNotifPermission()">📲 تفعيل الإشعارات</button>
        <button id="soundToggle" class="sound-btn" onclick="toggleSound()">🔔 الصوت: مفعّل</button>
        <button class="sound-btn" onclick="testAlert()">🔊 تجربة</button>
        <button class="sound-btn" onclick="fetchLiveFeeds(true)">🔄 تحديث</button>
        <span class="meta" id="updated">جاري الاتصال...</span>
      </div>
    </header>

    <div class="watchlist-box">
      <div class="watchlist-header">
        <span class="watchlist-title">⭐ أسهمي المراقبة (تمييز ذهبي + إشعار فوري + صوت)</span>
        <div class="add-ticker">
          <input type="text" id="tickerInput" placeholder="رمز السهم" onkeydown="if(event.key==='Enter') addTicker()" />
          <button onclick="addTicker()">+ إضافة</button>
        </div>
      </div>
      <div class="tickers-list" id="tickersList"></div>
    </div>

    <div class="filters">
      <button class="btn active" onclick="filterPosts('all', this)">الكل</button>
      <button class="btn gold-filter" onclick="filterPosts('watchlist', this)">⭐ أسهمي فقط</button>
      <button class="btn" onclick="filterPosts('positive', this)">🟢 إيجابي فقط</button>
      <button class="btn" onclick="filterPosts('negative', this)">🔴 سلبي فقط</button>
      <button class="btn" onclick="filterPosts('intradayrider', this)">@intradayrider</button>
      <button class="btn" onclick="filterPosts('nuntiobot', this)">@nuntiobot</button>
      <button class="btn" onclick="filterPosts('stockplaymaker1', this)">@stockplaymaker1</button>
      <button class="btn" onclick="filterPosts('askedgar_app', this)">@askedgar_app</button>
    </div>

    <div id="feed"></div>
  </div>

  <script>
    const ACCOUNTS = ['intradayrider', 'nuntiobot', 'stockplaymaker1', 'askedgar_app'];
    const NITTER_NODES = ['https://nitter.poast.org', 'https://xcancel.com', 'https://nitter.privacydev.net'];
    const DEFAULT_TICKERS = ['NCPL', 'DVLT', 'MEDS', 'LCID'];

    // كلمات مفتاحية لتحليل تأثير الخبر
    const POSITIVE_WORDS = [
      'approval', 'approved', 'fda', 'contract', 'awarded', 'partnership', 'collaborat',
      'beats', 'beat', 'surge', 'soar', 'jump', 'rally', 'record', 'growth', 'profit',
      'upgrade', 'outperform', 'buy', 'patent', 'granted', 'acquisition', 'acquire',
      'merger', 'launch', 'breakthrough', 'positive', 'phase 3', 'phase 2', 'clearance',
      'dividend', 'buyback', 'repurchase', 'secures', 'secured', 'expand', 'expansion'
    ];

    const NEGATIVE_WORDS = [
      'offering', 'public offering', 'direct offering', 'registered direct', 'dilution',
      'dilutive', 'bankruptcy', 'chapter 11', 'delist', 'delisting', 'nasdaq notice',
      'non-compliance', 'deficiency', 'miss', 'missed', 'loss', 'losses', 'plunge',
      'crash', 'tumble', 'drop', 'fall', 'downgrade', 'underperform', 'sell', 'halt',
      'halted', 'investigation', 'lawsuit', 'sec charge', 'subpoena', 'recall', 'terminate',
      'terminated', 'suspend', 'suspended', 'reverse split', 'going concern', 'layoff'
    ];

    // كلمات مستبعدة من استخراج الرموز
    const IGNORE_WORDS = new Set([
      'SEC', 'FDA', 'CEO', 'CFO', 'IPO', 'ETF', 'USA', 'USD', 'EPS', 'GDP', 'CPI',
      'FOMC', 'FED', 'NYSE', 'OTC', 'PR', 'NEWS', 'BREAKING', 'ALERT', 'UPDATE',
      'FOR', 'THE', 'AND', 'WITH', 'FROM', 'THIS', 'THAT', 'NEW', 'NOW', 'OUT', 'INC', 'CORP', 'LTD', 'LLC'
    ]);

    let watchlist = JSON.parse(localStorage.getItem('my_watchlist')) || DEFAULT_TICKERS;
    let seenLinks = new Set(JSON.parse(localStorage.getItem('seen_market_links')) || []);
    let translationCache = JSON.parse(localStorage.getItem('ar_translations_v2')) || {};
    let soundEnabled = true;
    let allPosts = [];
    let currentFilter = 'all';

    // استخراج رموز الأسهم من النص
    function extractTickers(text) {
      const found = new Set();
      // 1. البحث عن الرموز المسبوقة بعلامة $ مثل $DVLT
      const dollarMatches = text.match(/\$([A-Z]{1,5})\b/g);
      if (dollarMatches) {
        dollarMatches.forEach(m => {
          const sym = m.replace('$', '');
          if (!IGNORE_WORDS.has(sym)) found.add(sym);
        });
      }
      // 2. البحث عن رموز المحفظة المراقبة حتى لو لم تسبق بـ $
      watchlist.forEach(w => {
        const regex = new RegExp(`(^|[^A-Z0-9])\\$?${w}([^A-Z0-9]|$)`, 'i');
        if (regex.test(text)) found.add(w.toUpperCase());
      });
      // 3. إذا لم يُعثر على رمز بـ $، نبحث عن أول رمز كابيتال بين قوسين مثل (NVDA) أو (NASDAQ: NVDA)
      if (found.size === 0) {
        const parenMatches = text.match(/\((?:NASDAQ:|NYSE:|AMEX:)?\s*([A-Z]{2,5})\)/g);
        if (parenMatches) {
          parenMatches.forEach(m => {
            const sym = m.replace(/[\(\)\s]|NASDAQ:|NYSE:|AMEX:/g, '');
            if (!IGNORE_WORDS.has(sym)) found.add(sym);
          });
        }
      }
      return Array.from(found);
    }

    // تحليل تأثير الخبر (إيجابي / سلبي / محايد)
    function analyzeSentiment(text) {
      const lower = text.toLowerCase();
      let posScore = 0;
      let negScore = 0;

      POSITIVE_WORDS.forEach(w => { if (lower.includes(w)) posScore++; });
      NEGATIVE_WORDS.forEach(w => { if (lower.includes(w)) negScore++; });

      if (negScore > posScore) return { type: 'negative', label: '🔴 سلبي', css: 'sentiment-neg' };
      if (posScore > negScore) return { type: 'positive', label: '🟢 إيجابي', css: 'sentiment-pos' };
      return { type: 'neutral', label: '⚪ محايد', css: 'sentiment-neu' };
    }

    // نسخ رمز السهم بضغطة واحدة
    function copySymbol(symbol, btnEl) {
      navigator.clipboard.writeText(symbol).then(() => {
        const originalHtml = btnEl.innerHTML;
        btnEl.innerHTML = `✓ تم نسخ ${symbol}`;
        setTimeout(() => { btnEl.innerHTML = originalHtml; }, 1300);
      });
    }

    // نسخ نص الخبر بالكامل
    function copyFullPost(index, btnEl) {
      const p = allPosts[index];
      if (!p) return;
      const fullText = `${p.symbols.length ? p.symbols.map(s => '$' + s).join(' ') + '\n' : ''}${p.arTitle}\n\n${p.fullText}\n${p.link}`;
      navigator.clipboard.writeText(fullText).then(() => {
        const old = btnEl.textContent;
        btnEl.textContent = '✓ تم نسخ الخبر';
        setTimeout(() => { btnEl.textContent = old; }, 1300);
      });
    }

    function updateNotifButtonUI() {
      const btn = document.getElementById('notifBtn');
      if (!('Notification' in window)) {
        btn.style.display = 'none';
        return;
      }
      if (Notification.permission === 'granted') {
        btn.textContent = '✅ الإشعارات مفعّلة';
        btn.classList.add('granted');
      } else if (Notification.permission === 'denied') {
        btn.textContent = '🚫 الإشعارات محظورة';
      }
    }

    async function requestNotifPermission() {
      if (!('Notification' in window)) {
        alert('على الآيفون، أضف الصفحة للشاشة الرئيسية من Safari أولاً لتفعيل الإشعارات.');
        return;
      }
      const permission = await Notification.requestPermission();
      updateNotifButtonUI();
      if (permission === 'granted') {
        sendPushNotification('رادار السوق المباشر', 'تم تفعيل الإشعارات الفورية لأسهمك بنجاح! 🚀', '');
      }
    }

    function sendPushNotification(title, body, url) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          const notif = new Notification(title, { body: body, tag: url || 'market-alert', renotify: true });
          if (url) {
            notif.onclick = function() { window.focus(); window.open(url, '_blank'); notif.close(); };
          }
        } catch (e) {}
      }
    }

    function playAlertSound() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const tone = (freq, start, dur) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.25, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + dur);
        };
        tone(880, ctx.currentTime, 0.16);
        tone(1174.66, ctx.currentTime + 0.15, 0.25);
      } catch (e) {}
    }

    function testAlert() {
      playAlertSound();
      sendPushNotification('⚡ تجربة تنبيه: $DVLT (🟢 إيجابي)', 'هذا مثال لكيفية ظهور إشعار أخبار أسهمك على شاشة جهازك.', '');
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggle');
      btn.textContent = soundEnabled ? '🔔 الصوت: مفعّل' : '🔕 الصوت: مكتوم';
      btn.classList.toggle('muted', !soundEnabled);
      if (soundEnabled) playAlertSound();
    }

    function renderWatchlist() {
      document.getElementById('tickersList').innerHTML = watchlist.map(t => `
        <div class="ticker-tag">$${t} <span onclick="removeTicker('${t}')">×</span></div>
      `).join('');
    }

    function addTicker() {
      const input = document.getElementById('tickerInput');
      const val = input.value.trim().toUpperCase().replace(/[^A-Z]/g, '');
      if (val && !watchlist.includes(val)) {
        watchlist.push(val);
        localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
        renderWatchlist();
        fetchLiveFeeds(true);
      }
      input.value = '';
    }

    function removeTicker(ticker) {
      watchlist = watchlist.filter(t => t !== ticker);
      localStorage.setItem('my_watchlist', JSON.stringify(watchlist));
      renderWatchlist();
      applyFilter();
    }

    // تنظيف HTML لاستخراج النص الكامل للتغريدة دون قص
    function extractFullCleanText(item) {
      const rawHtml = item.description || item.content || item.title || '';
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = rawHtml.replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n');
      let text = (tempDiv.textContent || tempDiv.innerText || '').trim();
      // إزالة روابط nitter الداخلية الزائدة في نهاية التغريدة مع إبقاء كامل النص
      text = text.replace(/https?:\/\/(nitter\.[^\s]+|xcancel\.com[^\s]+)/g, '').trim();
      return text || item.title;
    }

    async function translateToArabic(text) {
      if (translationCache[text]) return translationCache[text];
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        const translated = data[0].map(item => item[0]).join('');
        translationCache[text] = translated;
        const keys = Object.keys(translationCache);
        if (keys.length > 200) delete translationCache[keys[0]];
        localStorage.setItem('ar_translations_v2', JSON.stringify(translationCache));
        return translated;
      } catch (e) {
        return text;
      }
    }

    async function fetchAccountDirect(account) {
      for (const node of NITTER_NODES) {
        try {
          const rssUrl = `${node}/${account}/rss`;
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&_=${Date.now()}`;
          const res = await fetch(apiUrl);
          const data = await res.json();
          if (data.status === 'ok' && data.items && data.items.length > 0) {
            return data.items.slice(0, 12).map(item => {
              const tweetId = item.link.split('/').pop().split('#')[0];
              const fullText = extractFullCleanText(item);
              return {
                account: account,
                fullText: fullText,
                link: `https://x.com/${account}/status/${tweetId}`,
                published: item.pubDate,
                ts: new Date(item.pubDate).getTime() || 0
              };
            });
          }
        } catch (e) { continue; }
      }
      return [];
    }

    async function fetchLiveFeeds(manual = false) {
      if (manual) document.getElementById('updated').textContent = 'جاري التحديث...';
      
      const results = await Promise.all(ACCOUNTS.map(acc => fetchAccountDirect(acc)));
      let combined = results.flat();

      if (combined.length === 0) {
        try {
          const res = await fetch('feed.json?t=' + Date.now());
          const fallback = await res.json();
          combined = (fallback.posts || []).map(p => ({
            account: p.account,
            fullText: p.title,
            link: p.link,
            published: p.published,
            ts: new Date(p.published).getTime() || 0
          }));
        } catch (e) {}
      }

      combined.sort((a, b) => b.ts - a.ts);
      allPosts = combined.slice(0, 50);

      // استخراج الرموز وتحليل التأثير وترجمة النص الكامل
      await Promise.all(allPosts.map(async p => {
        p.symbols = extractTickers(p.fullText);
        p.sentiment = analyzeSentiment(p.fullText);
        p.arTitle = await translateToArabic(p.fullText);
      }));

      let shouldRing = false;
      const isFirstRun = seenLinks.size === 0;

      allPosts.forEach(p => {
        if (!seenLinks.has(p.link)) {
          seenLinks.add(p.link);
          const matchedWatchlist = p.symbols.filter(s => watchlist.includes(s));
          if (!isFirstRun && matchedWatchlist.length > 0) {
            shouldRing = true;
            const tickersStr = matchedWatchlist.map(m => '$' + m).join(' ');
            sendPushNotification(
              `⚡ ${tickersStr} (${p.sentiment.label})`,
              p.arTitle || p.fullText,
              p.link
            );
          }
        }
      });

      localStorage.setItem('seen_market_links', JSON.stringify(Array.from(seenLinks).slice(-300)));
      if (shouldRing) playAlertSound();

      const now = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('updated').textContent = `مباشر • آخر فحص: ${now}`;
      applyFilter();
    }

    function highlightText(rawText, symbols) {
      let safe = rawText.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
      const toHighlight = Array.from(new Set([...watchlist, ...symbols]));
      toHighlight.forEach(ticker => {
        const regex = new RegExp(`(^|[^A-Z0-9])(\\$?${ticker})(?=[^A-Z0-9]|$)`, 'gi');
        safe = safe.replace(regex, `$1<mark class="ticker-hl">$2</mark>`);
      });
      return safe;
    }

    function filterPosts(filterType, btn) {
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = filterType;
      applyFilter();
    }

    function applyFilter() {
      let filtered = allPosts;
      if (currentFilter === 'watchlist') {
        filtered = allPosts.filter(p => p.symbols.some(s => watchlist.includes(s)));
      } else if (currentFilter === 'positive') {
        filtered = allPosts.filter(p => p.sentiment.type === 'positive');
      } else if (currentFilter === 'negative') {
        filtered = allPosts.filter(p => p.sentiment.type === 'negative');
      } else if (currentFilter !== 'all') {
        filtered = allPosts.filter(p => p.account === currentFilter);
      }
      renderPosts(filtered);
    }

    function renderPosts(posts) {
      const container = document.getElementById('feed');
      if (!posts.length) {
        container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:20px;">لا توجد أخبار مطابقة لهذا الفلتر حالياً...</p>';
        return;
      }
      container.innerHTML = posts.map((p) => {
        const realIndex = allPosts.indexOf(p);
        const isWatchlistMatch = p.symbols.some(s => watchlist.includes(s));

        // أزرار نسخ رموز الأسهم في أول الخبر
        const symbolsHtml = p.symbols.length > 0
          ? p.symbols.map(sym => {
              const isWatch = watchlist.includes(sym);
              return `<button class="copy-symbol-btn ${isWatch ? 'is-watchlist' : ''}" onclick="copySymbol('${sym}', this)" title="اضغط لنسخ رمز السهم">📋 $${sym}</button>`;
            }).join('')
          : `<span style="color:#64748b; font-size:0.82rem;">خبر عام</span>`;

        return `
          <div class="card ${isWatchlistMatch ? 'highlight' : ''}">
            <div class="card-top-bar">
              <div class="symbols-group">${symbolsHtml}</div>
              <span class="sentiment-badge ${p.sentiment.css}">${p.sentiment.label}</span>
            </div>
            <div class="card-meta">
              <span class="account-name">@${p.account}</span>
              <span class="card-time">${p.published}</span>
            </div>
            <div class="ar-text">${highlightText(p.arTitle || p.fullText, p.symbols)}</div>
            <div class="en-text">${highlightText(p.fullText, p.symbols)}</div>
            <div class="card-footer">
              <a href="${p.link}" target="_blank">فتح المنشور الأصلي على X ↗</a>
              <button class="copy-full-btn" onclick="copyFullPost(${realIndex}, this)">نسخ الخبر كاملاً</button>
            </div>
          </div>
        `;
      }).join('');
    }

    updateNotifButtonUI();
    renderWatchlist();
    fetchLiveFeeds();
    setInterval(() => fetchLiveFeeds(false), 15000);
  </script>
</body>
</html>
